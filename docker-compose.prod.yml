services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_NAME: SIMASS
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: db_simass
      DB_USERNAME: simass
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
      NING_WEBHOOK_SECRET: ${NING_WEBHOOK_SECRET:-}
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "true"
    volumes:
      - storage-app:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: db_simass
      DB_USERNAME: simass
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # Coolify Domain: point ws.simass.<domain> to service `reverb` port 8080
  reverb:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    stop_signal: SIGTERM
    expose:
      - "8080"
    environment:
      APP_NAME: SIMASS
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: db_simass
      DB_USERNAME: simass
      DB_PASSWORD: ${DB_PASSWORD}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: "8080"
      REVERB_APP_RATE_LIMITING_ENABLED: "true"
      REVERB_APP_RATE_LIMIT_MAX_ATTEMPTS: "60"
      REVERB_APP_RATE_LIMIT_DECAY_SECONDS: "60"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    stop_signal: SIGTERM
    environment:
      APP_NAME: SIMASS
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: db_simass
      DB_USERNAME: simass
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    volumes:
      - storage-app:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      reverb:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_simass
      MYSQL_USER: simass
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20

volumes:
  storage-app:
  dbdata:
